*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--blush);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- estructura ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
main{flex:1;padding:0 14px calc(var(--nav-h) + 96px + var(--safe-b));max-width:1180px;width:100%;margin:0 auto}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(var(--blush) 78%,rgba(246,228,218,0));
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 8px;max-width:1180px;margin:0 auto;width:100%}
.brand{display:flex;align-items:center;gap:10px;min-height:40px}
.mark{width:46px;height:46px;flex:none;border-radius:50%;background:#FEFAF1;border:1px solid var(--line);padding:2px;object-fit:contain}
.wordmark{display:flex;flex-direction:column;line-height:1}
.wordmark b{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:27px;letter-spacing:.2em;color:#4F5636}
.wordmark span{font-size:12.5px;letter-spacing:.42em;color:#7A6A4E;margin-top:3px;padding-left:2px}
.brand h1{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1}
.brand .sub{font-size:12.5px;color:var(--ink-2)}
.brand .grow{flex:1;min-width:0}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);padding:6px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--sage)}
.sync.pend i{background:var(--honey)} .sync.off i{background:var(--chili)} .sync.busy i{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);
  background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--ink-3);font-weight:600}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--plum)}
nav.tabs button[aria-current="page"] svg{stroke-width:2.2}
@media (min-width:900px){
  nav.tabs{top:0;right:auto;width:92px;height:auto;flex-direction:column;justify-content:flex-start;padding-top:90px;border-top:0;border-right:1px solid var(--line)}
  nav.tabs button{flex:none;height:76px}
  .topbar,main{padding-left:110px}
  main{padding-bottom:40px;max-width:1290px}
  .topbar{max-width:1290px}
}

/* ---------- piezas comunes ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);
  font-size:14px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill svg{width:16px;height:16px;flex:none}
.pill.on{background:var(--plum);color:var(--plum-ink);border-color:var(--plum)}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:16px}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--plum);color:var(--plum-ink)}
.btn.primary:active{background:var(--plum-2)}
.btn.soft{background:var(--card);border:1px solid var(--line-2);color:var(--ink)}
.btn.ghost{color:var(--plum)}
.btn.danger{background:var(--chili-soft);color:var(--chili)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:48px;height:48px;border-radius:14px;display:inline-grid;place-items:center;background:var(--card);border:1px solid var(--line-2);flex:none}
.iconbtn svg{width:24px;height:24px}
.iconbtn.accent{background:var(--saffron);border-color:var(--saffron);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:14px}
h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:18px 0 10px}
h3{font-size:16px;font-weight:700;margin:0 0 8px}
.muted{color:var(--ink-2)} .small{font-size:13px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px}
.b-ok{background:var(--sage-soft);color:var(--sage)} .b-pedir{background:var(--honey-soft);color:var(--honey)} .b-agotado{background:var(--chili-soft);color:var(--chili)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{min-height:48px;border-radius:12px;border:1px solid var(--line-2);background:#fff;padding:10px 12px;font-size:16px;width:100%}
.field textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{min-height:52px;border-radius:12px;background:#fff;border:1.5px solid var(--line-2);font-weight:700;font-size:14px;padding:4px}
.seg button[aria-pressed="true"]{background:var(--saffron-soft);border-color:var(--saffron);color:var(--ink)}

/* ---------- vender ---------- */
.ctx{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.ctx::-webkit-scrollbar{display:none}
.searchbar{display:flex;gap:8px;margin-top:10px}
.search{flex:1;position:relative}
.search input{width:100%;height:52px;border-radius:16px;border:1.5px solid var(--line-2);background:#fff;padding:0 14px 0 44px;font-size:17px}
.search svg{position:absolute;left:14px;top:15px;width:22px;height:22px;color:var(--ink-3)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none;margin:0 -14px;padding-left:14px;padding-right:14px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;background:transparent;border:1.5px solid var(--line-2);font-weight:600;font-size:14px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--blush);border-color:var(--ink)}
.today{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 8px}
.today b{font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1200px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{position:relative;text-align:left;min-height:118px;border-radius:var(--r-m);padding:12px 12px 10px 16px;background:var(--card);border:1px solid var(--line);
  display:flex;flex-direction:column;gap:2px;overflow:hidden;transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--sw,#E8A13A)}
.tile::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--sw,#E8A13A);opacity:.16}
.tile .ar{font-size:17px;font-weight:750;line-height:1.15;letter-spacing:-.01em;padding-right:22px}
.tile .ln{font-size:12.5px;color:var(--ink-2)}
.tile .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;padding-top:8px}
.tile .pr{font-weight:800;font-size:16px}
.tile .st{font-size:12px;font-weight:700;color:var(--ink-2)}
.tile.agotado{opacity:.55}
.tile.agotado .st{color:var(--chili)}
.tile .qty{position:absolute;top:8px;right:8px;min-width:26px;height:26px;border-radius:13px;background:var(--plum);color:var(--plum-ink);
  font-weight:800;font-size:14px;display:grid;place-items:center;padding:0 7px;z-index:1}
.tile.bump{animation:bump .25s}
@keyframes bump{40%{transform:scale(1.04)}}

.cartbar{position:fixed;left:10px;right:10px;bottom:calc(var(--nav-h) + var(--safe-b) + 10px);z-index:25;display:flex;align-items:center;gap:12px;
  background:var(--plum);color:var(--plum-ink);border-radius:20px;padding:10px 10px 10px 18px;box-shadow:0 14px 30px -12px rgba(94,39,66,.7)}
.cartbar .t{flex:1;line-height:1.2}
.cartbar .t b{display:block;font-size:20px;font-weight:800}
.cartbar .t span{font-size:13px;opacity:.85}
.cartbar .cx{width:46px;height:46px;border-radius:14px;background:rgba(255,243,234,.14);color:var(--plum-ink);display:grid;place-items:center;flex:none}
.cartbar .cx svg{width:22px;height:22px}
.cartbar .go{background:var(--saffron);color:var(--ink);min-height:52px;padding:0 22px;border-radius:14px;font-weight:800;font-size:17px}
@media (min-width:900px){
  .sellgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start;margin-top:10px}
  .sellgrid .chips{margin:0;padding:0 0 4px}
  .sellgrid .today{display:none}
  .cartbar{display:none!important}
  .dock{position:sticky;top:calc(var(--tb,170px) + 10px);max-height:calc(100vh - var(--tb,170px) - 24px);overflow:auto;padding:16px 16px 14px;border-radius:var(--r-m)}
  .dock h3{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
  .dock h3 span{font-size:12.5px;font-weight:600;color:var(--ink-3)}
  .dz{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px dashed var(--line-2);border-radius:12px;color:var(--ink-2);font-size:13.5px;line-height:1.3}
  .dz svg{width:22px;height:22px;flex:none;color:var(--ink-3)}
  .hoyres{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
  .hoyres b{font-size:19px;font-weight:800}
  .ult{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 0;color:var(--ink-2)}
  .ult span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ult span:last-child{font-weight:700;color:var(--ink);flex:none}
  .dock .seg{grid-auto-flow:row;grid-template-columns:1fr 1fr}
  .dock .seg button{min-height:42px}
  .dock .cl .nm b{font-size:15px}
  .dock .cl .nm span{font-size:12.5px}
  .dock .step button{width:32px;height:36px;font-size:19px}
  .dock .step output{min-width:22px;font-size:15px}
  .dock .total b{font-size:24px}
}
@media (max-width:899px){.dock{display:none}}

/* ---------- hojas (bottom sheets) ---------- */
.scrim{position:fixed;inset:0;background:rgba(59,34,25,.42);z-index:50;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:92vh;display:flex;flex-direction:column;background:var(--card);
  border-radius:var(--r-l) var(--r-l) 0 0;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--safe-b)}
.sheet.show{transform:none}
@media (min-width:900px){.sheet{left:50%;right:auto;width:560px;margin-left:-280px;bottom:auto;top:50%;border-radius:var(--r-l);transform:translateY(-40%);opacity:0;max-height:86vh}
  .sheet.show{transform:translateY(-50%);opacity:1}}
.sheet .hd{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.sheet .hd h3{flex:1;font-size:19px;margin:0}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line-2);margin:8px auto 0}
.sheet .bd{overflow:auto;padding:4px 18px 18px;flex:1}
.sheet .ft{padding:12px 18px 16px;border-top:1px solid var(--line);display:flex;gap:10px}

.cl{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cl .sw{width:10px;align-self:stretch;border-radius:5px;background:var(--sw)}
.cl .nm{flex:1;min-width:0}
.cl .nm b{display:block;font-size:16px;line-height:1.2}
.cl .nm span{font-size:13px;color:var(--ink-2)}
.step{display:flex;align-items:center;border:1.5px solid var(--line-2);border-radius:12px;overflow:hidden;background:#fff}
.step button{width:42px;height:44px;font-size:22px;font-weight:700;color:var(--plum)}
.step output{min-width:30px;text-align:center;font-weight:800;font-size:17px}
.alts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.alts button{font-size:12.5px;padding:5px 9px;border-radius:999px;background:var(--saffron-soft);font-weight:600}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 6px}
.total b{font-size:28px;font-weight:800;letter-spacing:-.02em}

/* ---------- listas y panel ---------- */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none}
.li:last-child{border-bottom:0}
.li .nm{flex:1;min-width:0}
.li .nm b{display:block;font-weight:700;line-height:1.25}
.li .nm span{display:block;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .rt{text-align:right;flex:none}
.li .rt b{display:block;font-weight:800}
.stocknum{font-size:22px;font-weight:800;min-width:44px;text-align:right}
.toolbar{display:flex;gap:8px;align-items:center;margin:12px 0}
.toolbar .search{flex:1}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px}
.kpi span{font-size:13px;color:var(--ink-2);display:block}
.kpi b{font-size:21px;font-weight:800;letter-spacing:-.01em;display:block;margin-top:2px}
.kpi small{font-size:12px;font-weight:700}
.kpi.hero{grid-column:1/-1;background:var(--plum);color:var(--plum-ink);border-color:var(--plum);padding:16px 18px}
.kpi.hero span{color:rgba(255,243,234,.8)}
.kpi.hero b{font-size:34px}
.up{color:var(--sage)} .down{color:var(--chili)}
.kpi.hero .up{color:#C8E3B5} .kpi.hero .down{color:#FFC2B3}
.panelgrid{display:grid;gap:12px}
@media (min-width:900px){.panelgrid{grid-template-columns:1fr 1fr}}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;font-size:13.5px}
.bar .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{height:14px;border-radius:7px;background:var(--blush);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:7px;background:var(--saffron)}
.bar .vl{font-weight:700;text-align:right;min-width:72px}
.cols{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:10px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.cols .c i{width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--plum-2);min-height:2px}
.cols .c i.z{background:var(--line)}
.cols .c span{font-size:10px;color:var(--ink-3)}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0}
.monthnav b{font-size:20px;font-weight:800;text-transform:capitalize}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td{padding:7px 0;border-bottom:1px solid var(--line)}
table.t td:last-child{text-align:right;font-weight:700}
table.t tr.tot td{font-weight:800;border-bottom:0;font-size:15px}
.subtabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin:12px 0}
.subtabs button{flex:1;min-height:42px;border-radius:10px;font-weight:700;font-size:14px;color:var(--ink-2)}
.subtabs button[aria-pressed="true"]{background:var(--plum);color:var(--plum-ink)}
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);z-index:24;width:60px;height:60px;border-radius:20px;background:var(--saffron);
  display:grid;place-items:center;box-shadow:0 12px 26px -10px rgba(185,116,26,.8)}
.fab svg{width:28px;height:28px}
@media (min-width:900px){.fab{bottom:28px;right:28px}}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--honey-soft);color:#6B4310;font-size:14px;margin-top:10px}
.banner.err{background:var(--chili-soft);color:#7A2416}
.banner b{display:block}
.banner svg{width:20px;height:20px;flex:none;align-self:center}

/* ---------- escáner y voz ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:#1E120D;color:#fff;display:flex;flex-direction:column}
.overlay .hd{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px}
.overlay .hd b{flex:1;font-size:18px}
.overlay .x{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff}
.camwrap{position:relative;flex:1;overflow:hidden;display:grid;place-items:center}
.camwrap video{width:100%;height:100%;object-fit:cover}
#qrbox{width:100%;height:100%}
#qrbox video{object-fit:cover}
.aim{position:absolute;left:12%;right:12%;top:38%;height:22%;border:3px solid var(--saffron);border-radius:18px;box-shadow:0 0 0 2000px rgba(30,18,13,.45);pointer-events:none}
.scanlog{padding:12px 14px calc(14px + var(--safe-b));background:#2A1912;display:flex;flex-direction:column;gap:10px}
.scanlog .last{min-height:24px;font-weight:700;color:var(--saffron-soft)}
.voz{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px;text-align:center}
.ring{width:132px;height:132px;border-radius:50%;background:var(--saffron);display:grid;place-items:center;color:var(--ink);position:relative}
.ring svg{width:56px;height:56px}
.ring.live::before,.ring.live::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px solid var(--saffron);opacity:.5;animation:ripple 1.6s infinite}
.ring.live::after{animation-delay:.8s}
@keyframes ripple{to{inset:-46px;opacity:0}}
.transcript{font-size:22px;font-weight:700;min-height:64px;max-width:560px}
.voz textarea{width:100%;max-width:560px;min-height:90px;border-radius:14px;border:0;padding:12px;font-size:17px;color:var(--ink)}

/* ---------- confirmación con humo ---------- */
.done{position:fixed;inset:0;z-index:70;display:grid;place-items:center;pointer-events:none}
.done .bx{background:var(--card);border-radius:24px;padding:26px 28px 20px;text-align:center;box-shadow:0 30px 60px -20px rgba(59,34,25,.55);pointer-events:auto;min-width:260px;position:relative}
.done .bx b{display:block;font-size:22px;font-weight:800;margin-top:6px}
.done .bx span{color:var(--ink-2);font-size:14px}
.smoke{width:90px;height:110px;display:block;margin:-6px auto 0}
.smoke path{fill:none;stroke:var(--plum-2);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:160;stroke-dashoffset:160;animation:rise 1.5s ease-out forwards}
.smoke path:nth-child(2){animation-delay:.18s;stroke:var(--saffron)}
.smoke path:nth-child(3){animation-delay:.34s;opacity:.6}
.smoke circle{fill:var(--chili);animation:glow 1.2s ease-in-out infinite alternate}
@keyframes rise{to{stroke-dashoffset:0}}
@keyframes glow{to{fill:var(--saffron)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--safe-b) + 84px);z-index:80;background:var(--ink);color:var(--blush);
  padding:12px 16px;border-radius:14px;font-weight:600;font-size:14.5px;display:flex;gap:14px;align-items:center;max-width:92vw;box-shadow:var(--shadow)}
.toast button{color:var(--saffron);font-weight:800;white-space:nowrap}
.toast{white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.smoke path{stroke-dashoffset:0}}
</style>

const PALETA = ['#E3B566','#D9788B','#9A7BB5','#9C6B43','#E2A32B','#B0455C','#5B8A99','#D2783A','#7E9C63'];
function colorAroma(p) {
  const t = norm((p.aroma || '') + ' ' + p.linea);
  for (const [re, c] of SWATCHES) if (re.test(t)) return c;
  let h = 0; for (const ch of t) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return PALETA[h % PALETA.length];
}

  sync: { estado: 'ok', ultima: store.get('ultimaSync', null) },
  mes: null,
  D: null,
};
const HOJA_DE = { venta: 'ventas' };

function datos() { return S.D; }
function recalcular() {
  const b = S.base ? JSON.parse(JSON.stringify(S.base)) : vacio();
  for (const op of S.cola) aplicarLocal(b, op);
  S.D = derivar(b);
}
function vacio() {
  return { productos: [], ventas: [], compras: [], gastos: [], bajas: [], clientes: [], proveedores: [], vendedores: [], ferias: [], config: { listas: {}, parametros: {} } };
}
function aplicarLocal(b, op) {
  if (op.tipo === 'venta') {
    (op.lineas || []).forEach((l, i) => b.ventas.push({
      _r: null, _op: op.id, 'Fecha': op.fecha, 'Nº de venta': '', 'Cliente': op.cliente || 'Varios', 'Vendedor': op.vendedor,
      'Canal': op.canal, 'Código producto': l.codigo, 'Cantidad': l.cant, 'Precio cobrado (opcional)': l.precio ?? '',
      'Descuento %': l.desc ?? '', 'Medio de pago': op.medio, 'Estado de cobro': op.cobro || 'Cobrado',
      'Observaciones': i ? '' : (op.obs || ''), 'Feria / evento': op.feria || '', 'ID app': op.id }));
  } else if (op.tipo === 'anularVenta') {
    b.ventas = b.ventas.filter(v => !((op.ventaId && v['ID app'] === op.ventaId) || (op.nro && String(v['Nº de venta']) === String(op.nro)) ||
      (op.filas && v._r && op.filas.includes(v._r))));
  } else if (op.tipo === 'guardar') {
    const arr = b[op.hoja]; if (!arr) return;
    if (op.fila) { const x = arr.find(r => r._r === op.fila); if (x) Object.assign(x, op.datos); }
    else arr.push(Object.assign({ _r: null, _op: op.id }, op.datos));
  } else if (op.tipo === 'borrar') {
    const arr = b[op.hoja]; if (!arr) return; b[op.hoja] = arr.filter(r => r._r !== op.fila);
  } else if (op.tipo === 'codigoBarras') {
    const p = b.productos.find(x => trim(x['Código']) === op.codigoProducto);
    if (p) { const a = trim(p['Código de barras']).split(/[,\s]+/).filter(Boolean); if (!a.includes(op.codigoBarras)) a.push(op.codigoBarras); p['Código de barras'] = a.join(', '); }
  }
}

/* ---------- cálculos (mismas reglas que la planilla) ---------- */
function derivar(b) {
  const D = { raw: b, config: b.config || { listas: {}, parametros: {} } };
  const comp = {}; // por código: cant, total
  (b.compras || []).forEach(c => {
    const k = trim(c['Código producto']); if (!k) return;
    const q = num(c['Cantidad']), cu = num(c['Costo unitario (Gs.)']);
    comp[k] = comp[k] || { q: 0, t: 0 }; comp[k].q += q; comp[k].t += q * cu;
  });
  const bajasPor = {};
  (b.bajas || []).forEach(x => {
    const k = trim(x['Código producto']); if (!k) return;
    const q = num(x['Cantidad (siempre positiva)']);
    bajasPor[k] = (bajasPor[k] || 0) + (trim(x['Tipo de baja / ajuste']) === 'Ajuste inventario (+)' ? q : -q);
  });
  D.productos = (b.productos || []).map(p => {
    const codigo = trim(p['Código']);
    const c = comp[codigo];
    const costoRef = num(p['Costo de referencia (Gs.)']);
    return {
      _r: p._r, raw: p, codigo, linea: trim(p['Producto']), aroma: trim(p['Aroma / variante']), categoria: trim(p['Categoría']),
      presentacion: trim(p['Presentación']), proveedor: trim(p['Proveedor principal']), costoRef,
      costo: c && c.q ? c.t / c.q : costoRef, precio: num(p['Precio de venta (Gs.)']), inicial: num(p['Stock inicial']),
      entradas: c ? c.q : 0, bajas: bajasPor[codigo] || 0, salidas: 0, min: p['Stock mínimo'] === '' || p['Stock mínimo'] == null ? null : num(p['Stock mínimo']),
      ideal: p['Stock ideal'] === '' || p['Stock ideal'] == null ? null : num(p['Stock ideal']),
      barras: trim(p['Código de barras']).split(/[,\s]+/).filter(Boolean),
    };
  });
  D.prod = {}; D.productos.forEach(p => { D.prod[p.codigo] = p; });
  const comis = {}; (b.vendedores || []).forEach(v => { comis[trim(v['Nombre'])] = num(v['% Comisión']); });
  D.ventas = (b.ventas || []).map(v => {
    const p = D.prod[trim(v['Código producto'])];
    const cant = num(v['Cantidad']);
    const lista = p ? p.precio : num(v['Precio de lista (Gs.)']);
    const cobrado = v['Precio cobrado (opcional)'] === '' || v['Precio cobrado (opcional)'] == null ? null : num(v['Precio cobrado (opcional)']);
    const total = cant * (cobrado == null ? lista : cobrado) * (1 - num(v['Descuento %']));
    const costo = cant * (p ? p.costo : num(v['Costo unitario (Gs.)']));
    const vend = trim(v['Vendedor']);
    return {
      _r: v._r, _op: v._op, raw: v, fecha: trim(v['Fecha']), nro: trim(v['Nº de venta']), cliente: trim(v['Cliente']) || 'Varios', vendedor: vend,
      canal: trim(v['Canal']), codigo: trim(v['Código producto']), cant, total, costo, ganancia: total - costo,
      comision: total * (comis[vend] || 0), medio: trim(v['Medio de pago']), cobro: trim(v['Estado de cobro']) || 'Cobrado',
      feria: trim(v['Feria / evento']), id: trim(v['ID app']), obs: trim(v['Observaciones']),
      linea: p ? p.linea : trim(v['Producto']), aroma: p ? p.aroma : trim(v['Aroma/Tipo']), categoria: p ? p.categoria : trim(v['Categoría']),
    };
  });
  D.ventas.forEach(v => { if (D.prod[v.codigo]) D.prod[v.codigo].salidas += v.cant; });
  const hace30 = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10);
  const hace60 = new Date(Date.now() - 60 * 864e5).toISOString().slice(0, 10);
  D.productos.forEach(p => {
    p.stock = p.inicial + p.entradas - p.salidas + p.bajas;
    p.estado = p.stock <= 0 ? 'AGOTADO' : (p.min != null && p.stock <= p.min ? 'PEDIR' : 'OK');
    p.pedir = p.estado === 'OK' ? 0 : Math.max((p.ideal != null ? p.ideal : (p.min || 0) * 2) - p.stock, (p.min || 0) + 1 - p.stock, 1);
    p.v30 = 0; p.v60 = 0;
  });
  D.ventas.forEach(v => { const p = D.prod[v.codigo]; if (!p) return; if (v.fecha >= hace30) p.v30 += v.cant; if (v.fecha >= hace60) p.v60 += v.cant; });
  // agrupación de ventas en tickets
  D.tickets = []; const porClave = {};
  D.ventas.forEach(v => {
    const k = v.id ? 'id:' + v.id : v.nro ? 'n:' + v.nro : 'r:' + (v._r || v._op);
    if (!porClave[k]) { porClave[k] = { clave: k, fecha: v.fecha, nro: v.nro, id: v.id, vendedor: v.vendedor, cliente: v.cliente, medio: v.medio, feria: v.feria, canal: v.canal, lineas: [], total: 0, pendiente: !v._r }; D.tickets.push(porClave[k]); }
    porClave[k].lineas.push(v); porClave[k].total += v.total;
  });
  D.tickets.sort((a, b2) => (b2.fecha || '').localeCompare(a.fecha || '') || (Number(b2.nro) || 9e9) - (Number(a.nro) || 9e9));
  D.gastos = (b.gastos || []).map(g => ({ _r: g._r, raw: g, fecha: trim(g['Fecha']), categoria: trim(g['Categoría']), desc: trim(g['Descripción']), monto: num(g['Monto (Gs.)']), tipo: trim(g['Fijo / Variable']), medio: trim(g['Medio de pago']), a: trim(g['Pagado a']) }));
  D.compras = (b.compras || []).map(c => { const q = num(c['Cantidad']), cu = num(c['Costo unitario (Gs.)']); const p = D.prod[trim(c['Código producto'])];
    return { _r: c._r, raw: c, fecha: trim(c['Fecha']), proveedor: trim(c['Proveedor']), codigo: trim(c['Código producto']), cant: q, cu, total: q * cu, estado: trim(c['Estado de pago']) || 'Pagado', medio: trim(c['Medio de pago']), factura: trim(c['Nº factura / remito']), linea: p ? p.linea : trim(c['Producto']), aroma: p ? p.aroma : trim(c['Aroma']) }; });
  D.bajas = (b.bajas || []).map(x => { const p = D.prod[trim(x['Código producto'])]; const q = num(x['Cantidad (siempre positiva)']); const tipo = trim(x['Tipo de baja / ajuste']);
    return { _r: x._r, raw: x, fecha: trim(x['Fecha']), codigo: trim(x['Código producto']), tipo, cant: q, perdida: tipo === 'Ajuste inventario (+)' ? 0 : q * (p ? p.costo : 0), motivo: trim(x['Motivo / responsable']), linea: p ? p.linea : trim(x['Producto']), aroma: p ? p.aroma : trim(x['Aroma']) }; });
  D.clientes = (b.clientes || []).map(c => ({ _r: c._r, raw: c, nombre: trim(c['Nombre y apellido']), tel: trim(c['Teléfono / WhatsApp']) }));
  D.proveedores = (b.proveedores || []).map(p => ({ _r: p._r, raw: p, nombre: trim(p['Nombre / Razón social']), contacto: trim(p['Persona de contacto']), tel: trim(p['Teléfono / WhatsApp']), plazo: num(p['Plazo de entrega (días)']) }));
  D.vendedores = (b.vendedores || []).map(v => ({ _r: v._r, raw: v, nombre: trim(v['Nombre']), comision: num(v['% Comisión']), activo: trim(v['Activo']).toLowerCase() !== 'no', meta: num(v['Meta mensual (Gs.)']) }));
  D.ferias = (b.ferias || []).map(f => ({ _r: f._r, raw: f, nombre: trim(f['Nombre']), fecha: trim(f['Fecha']), lugar: trim(f['Lugar']), costo: num(f['Costo stand (Gs.)']), notas: trim(f['Notas']) }))
    .sort((a, b2) => (b2.fecha || '').localeCompare(a.fecha || ''));
  D.lineas = [...new Set(D.productos.map(p => p.linea))];
  D.listas = Object.assign({
    'Categorías de productos': ['Sahumerios','Difusores','Porta sahumerios y accesorios'],
    'Medios de pago': ['Efectivo','Transferencia','QR / billetera','Tarjeta de débito','Tarjeta de crédito'],
    'Canales de venta': ['Local / punto de venta','Ferias y eventos','WhatsApp','Instagram'],
    'Categorías de gasto': ['Ferias (stands)','Packaging y etiquetas','Publicidad y redes','Transporte','Otros'],
    'Tipos de baja / ajuste': ['Rotura / daño','Muestra / degustación','Regalo / promoción','Ajuste inventario (+)','Ajuste inventario (-)'],
    'Estado de pago (compras)': ['Pagado','Pendiente'], 'Estado de cobro (ventas)': ['Cobrado','Pendiente'], 'Tipo de gasto': ['Fijo','Variable'],
  }, Object.fromEntries(Object.entries(D.config.listas || {}).filter(([, v]) => v && v.length)));
  return D;
}

/* =====================================================================
   SINCRONIZACIÓN
   ===================================================================== */
function apiUrl() { return trim(S.disp.apiUrl) || (API_URL.startsWith('http') ? API_URL : ''); }
function clave() { return trim(S.disp.clave) || (CLAVE.startsWith('/*') ? '' : CLAVE); }
function linkConexion() {
  const base = SITIO.startsWith('http') ? SITIO : (location.protocol === 'https:' && !enGoogle() ? location.origin + location.pathname : '');
  if (!base || !apiUrl() || !clave()) return '';
  const b = btoa(unescape(encodeURIComponent(JSON.stringify({ u: apiUrl(), k: clave() })))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  return base + '#conectar=' + b;
}
function enGoogle() { return !!(window.google && google.script && google.script.run); }
function conectado() { return enGoogle() || !!apiUrl(); }
function llamar(req) {
  if (enGoogle()) return new Promise((res, rej) => google.script.run.withSuccessHandler(t => res(JSON.parse(t))).withFailureHandler(rej).api(JSON.stringify(req)));
  const url = apiUrl(); if (!url) return Promise.reject(new Error('sin-conexion-configurada'));
  return fetch(url, { method: 'POST', body: JSON.stringify(Object.assign({ clave: clave() }, req)), redirect: 'follow' }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}
let sincronizando = null;
function sincronizar(forzar) {
  if (!conectado()) { S.sync.estado = S.cola.length ? 'pend' : 'demo'; pintarSync(); return Promise.resolve(); }
  if (sincronizando) return sincronizando;
  if (!forzar && !S.cola.length && S.sync.ultima && Date.now() - new Date(S.sync.ultima) < 20000) return Promise.resolve();
  const enviadas = S.cola.slice();
  S.sync.estado = 'busy'; pintarSync();
  const req = enviadas.length ? { accion: 'ops', ops: enviadas } : { accion: 'cargar' };
  sincronizando = llamar(req).then(r => {
    if (r && r.error === 'clave') throw new Error('La clave de conexión no es válida. Pedí un link de conexión nuevo.');
    if (!r || !r.ok) throw new Error(r && r.error || 'Error del servidor');
    const ids = new Set(enviadas.map(o => o.id));
    (r.resultados || []).forEach(x => {
      if (!x.ok) { const op = enviadas.find(o => o.id === x.id); S.errores.push({ op, error: x.error, cuando: new Date().toISOString() }); }
    });
    S.cola = S.cola.filter(o => !ids.has(o.id));
    S.base = r.datos; store.set('base', S.base); store.set('cola', S.cola); store.set('errores', S.errores);
    S.sync.ultima = new Date().toISOString(); store.set('ultimaSync', S.sync.ultima);
    S.sync.estado = S.cola.length ? 'pend' : 'ok';
    recalcular(); render();
    if (!S.disp.vendedor && !sincronizar.pidio && datos().vendedores.length && !pilaHojas.length) { sincronizar.pidio = true; elegirVendedor(); }
  }).catch(err => {
    S.sync.estado = 'off'; S.sync.error = String(err && err.message || err); pintarSync();
  }).finally(() => { sincronizando = null; if (S.cola.length && S.sync.estado !== 'off') setTimeout(() => sincronizar(), 400); });
  return sincronizando;
}
function encolar(op) {
  op.id = op.id || uid(); op.creada = new Date().toISOString();
  S.cola.push(op); store.set('cola', S.cola); recalcular(); sincronizar(true); return op;
}
function desencolar(id) { const i = S.cola.findIndex(o => o.id === id); if (i >= 0) { S.cola.splice(i, 1); store.set('cola', S.cola); recalcular(); return true; } return false; }
window.addEventListener('online', () => sincronizar(true));
document.addEventListener('visibilitychange', () => { if (!document.hidden) sincronizar(); });
setInterval(() => { if (!document.hidden) sincronizar(); }, 45000);

function pintarSync() {
  const el = $('#sync'); if (!el) return;
  const e = S.sync.estado, n = S.cola.length;
  el.className = 'sync ' + ({ busy: 'busy pend', pend: 'pend', off: 'off', demo: 'pend' }[e] || '');
  el.querySelector('span').textContent = e === 'busy' ? 'Guardando…' : e === 'off' ? (n ? n + ' sin subir' : 'Sin conexión') :
    e === 'demo' ? 'Sin conectar' : n ? n + ' por subir' : 'Al día';
}

function productosFiltrados() {
  const D = datos(); const q = norm(S.filtro.q);
  let lista = D.productos;
  if (q) {
    const partes = q.split(/\s+/);
    lista = lista.filter(p => { const t = norm([p.linea, p.aroma, p.codigo, p.presentacion, p.categoria, p.barras.join(' ')].join(' ')); return partes.every(x => t.includes(x)); });
  } else if (S.filtro.linea === 'frec') {
    // Todos los productos: primero los que más se venden, después el resto (con stock primero) por nombre.
    lista = lista.slice().sort((a, b) => (b.v60 - a.v60) || ((b.stock > 0) - (a.stock > 0)) || (a.linea + a.aroma).localeCompare(b.linea + b.aroma, 'es'));
  } else if (S.filtro.linea === 'todos') {
    lista = lista.slice().sort((a, b) => a.linea.localeCompare(b.linea, 'es') || a.aroma.localeCompare(b.aroma, 'es'));
  } else {
    lista = lista.filter(p => p.linea === S.filtro.linea);
  }
  return lista;
}
function pintarTiles() {

function buscarPorCodigo(texto) {

function abrirEscaner(modo, alLeer) {

async function ayudaCamara(ov, err, reintentar) {
  const ua = navigator.userAgent;

    pasos = 'Este navegador no permite la cámara acá. Abrí la app desde su link en <b>' + (ios ? 'Safari' : 'Chrome') + '</b>.';
  } else if (enOtraApp) {

  } else if (denegado && ios) {

  } else if (denegado) {
    pasos = (estado === 'denied' ? 'Chrome tiene la cámara <b>bloqueada</b> para esta app.' : 'Chrome no recibió permiso para la cámara.') +
      '<br><br>1. Tocá el ícono <b>⚙︎ / candado</b> a la izquierda de la dirección (arriba) → <b>Permisos</b> → <b>Cámara</b> → <b>Permitir</b>.' +
      '<br>2. Si ya está permitido: Ajustes del teléfono → Aplicaciones → <b>Chrome</b> → Permisos → <b>Cámara</b> → Permitir.' +
      '<br>3. Si instalaste la app en la pantalla de inicio, mantené apretado su ícono → <b>Información</b> → Permisos → Cámara.';
  } else {
    pasos = 'No encontré la cámara o la está usando otra app. Cerrá otras apps de cámara y reintentá.';
  }

    <p class="small" style="opacity:.75;margin-top:12px">Mientras tanto podés usar <b>Sacar foto del código</b>.</p></div>`;
  $('#scRe', ov).onclick = reintentar;

async function iniciarCamara(onCode) {
  const formatos = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'qr_code', 'itf'];
  if ('BarcodeDetector' in window) {
    try {
      const sup = await BarcodeDetector.getSupportedFormats();
      const det = new BarcodeDetector({ formats: formatos.filter(f => sup.includes(f)) });
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false });
      const v = document.createElement('video'); v.playsInline = true; v.muted = true; v.srcObject = stream; $('#qrbox').appendChild(v); await v.play();
      scan = { stream, activo: true };
      const loop = async () => { if (!scan || !scan.activo) return; try { const r = await det.detect(v); if (r[0]) onCode(r[0].rawValue); } catch (e) {} setTimeout(loop, 120); };
      loop(); return;
    } catch (e) { if (e && e.name === 'NotAllowedError') throw e; }
  }
  if (!window.Html5Qrcode) throw new Error('sin-libreria');
  const h = new Html5Qrcode('qrbox', { verbose: false, formatsToSupport: [0, 3, 4, 5, 8, 9, 10, 14, 15] });
  scan = { h, activo: true };
  await h.start({ facingMode: 'environment' }, { fps: 12, qrbox: (w, hh) => ({ width: Math.floor(w * .8), height: Math.floor(hh * .35) }) }, txt => onCode(txt), () => {});
}
async function detenerCamara() {

  scan = null;
}

  }

  let div = $('#qrfile'); if (!div) { div = document.createElement('div'); div.id = 'qrfile'; div.className = 'hidden'; document.body.appendChild(div); }

const NUMS = { un: 1, uno: 1, una: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10, once: 11, doce: 12, media: 6, docena: 12 };

const MEDIOS_VOZ = [[/\b(efectivo|cash|contado)\b/, 'Efectivo'], [/\btransf\w*/, 'Transferencia'], [/\b(qr|billetera)\b/, 'QR / billetera'], [/\b(tarjeta de )?debito\b/, 'Tarjeta de débito'], [/\b(tarjeta( de credito)?|credito)\b/, 'Tarjeta de crédito']];

function indiceVoz() {
  if (indiceVoz.cache && indiceVoz.cache.D === S.D) return indiceVoz.cache.idx;
  const idx = datos().productos.map(p => {
    const ar = tokens(p.aroma).flatMap(t => NUM_A_PAL[t] ? [t, NUM_A_PAL[t]] : [t]).filter(t => !RELLENO.has(t));
    const ln = tokens(p.linea + ' ' + (p.categoria === 'Porta sahumerios y accesorios' ? 'porta' : '')).filter(t => !RELLENO.has(t));
    return { p, ar, ln };

}
function lev(a, b) {

function simTok(a, b) {

    e.ln.forEach(t => { const s = simTok(q, t) * .8; if (s > best) { best = s; esAr = false; } });

function interpretarVoz(texto) {

  const segs = []; let cur = null;

  tk.forEach(w => {
    if (w === ',') { if (cur && cur.w.length) { segs.push(cur); cur = null; } return; }
    if (esNum(w) && (!cur || cur.w.length)) { if (cur) segs.push(cur); cur = { q: w, w: [] }; return; }
    if (!cur) cur = { q: null, w: [] };
    cur.w.push(w);
  });
  if (cur) segs.push(cur);

    const limpias = palabras.filter(w => !RELLENO.has(w));
    const cand = [];
    const qn = q == null ? 1 : (/^\d+$/.test(q) ? Number(q) : NUMS[q]);
    if (limpias.length) cand.push({ cant: qn, toks: limpias, r: mejores(limpias) });
    if (q != null && !/^\d+$/.test(q) && limpias.length) { const t2 = [q, ...limpias]; cand.push({ cant: 1, toks: t2, r: mejores(t2) }); }
    if (q != null && /^\d+$/.test(q) && limpias.length) { const t2 = [q, ...limpias]; cand.push({ cant: 1, toks: t2, r: mejores(t2) }); }

    if (!sg.w.filter(w => !RELLENO.has(w)).length) return;

    const alts = r.r.slice(1, 4).filter(x => x.s >= top.s - .08 && x.s >= .5).map(x => x.p.codigo);

function rangoMes(ym) { const [y, m] = ym.split('-').map(Number); const fin = new Date(y, m, 0).getDate(); return [ym + '-01', ym + '-' + String(fin).padStart(2, '0'), fin]; }
function mesAnterior(ym) { let [y, m] = ym.split('-').map(Number); m--; if (!m) { m = 12; y--; } return y + '-' + String(m).padStart(2, '0'); }

function resultados(D, ym) {
  const [a, b] = rangoMes(ym); const en = f => f >= a && f <= b;
  const vs = D.ventas.filter(v => en(v.fecha)), gs_ = D.gastos.filter(g => en(g.fecha));
  const ventas = vs.reduce((s, v) => s + v.total, 0), cmv = vs.reduce((s, v) => s + v.costo, 0), comis = vs.reduce((s, v) => s + v.comision, 0);
  const gastos = gs_.reduce((s, g) => s + g.monto, 0), fijos = gs_.filter(g => g.tipo === 'Fijo').reduce((s, g) => s + g.monto, 0);
  const tickets = new Set(D.tickets.filter(t => en(t.fecha)).map(t => t.clave)).size;
  const bruta = ventas - cmv, neta = bruta - gastos - comis;
  const cobrado = vs.filter(v => v.cobro !== 'Pendiente').reduce((s, v) => s + v.total, 0);
  const pagado = D.compras.filter(c => en(c.fecha) && c.estado !== 'Pendiente').reduce((s, c) => s + c.total, 0);
  const perdidas = D.bajas.filter(x => en(x.fecha)).reduce((s, x) => s + x.perdida, 0);
  return { vs, ventas, cmv, bruta, margen: ventas ? bruta / ventas : null, gastos, fijos, comis, neta, margenNeto: ventas ? neta / ventas : null, tickets,
    ticket: tickets ? ventas / tickets : 0, unidades: vs.reduce((s, v) => s + v.cant, 0), cobrado, pagado, flujo: cobrado - pagado - gastos - comis, perdidas };

function barras(items, fmtV = fmt, color) {

}

        <tr><td>Para reponer / agotados</td><td>${D.productos.filter(p => p.estado === 'PEDIR').length} / ${D.productos.filter(p => p.estado === 'AGOTADO').length}</td></tr><tr><td>Pérdidas por bajas del mes</td><td>${fmt(R.perdidas)}</td></tr></table></div>
      <div class="card" style="grid-column:1/-1"><h3>Año ${año}: ventas y ganancia neta</h3><div class="cols" style="height:150px">${anio.map(([m, v, n]) => `<div class="c" title="${m}: ventas ${gs(v)} · neta ${gs(n)}"><i class="${v ? '' : 'z'}" style="height:${Math.max(2, v / maxAnio * 110)}px;background:var(--saffron)"></i><span>${m}</span></div>`).join('')}</div>
        <p class="small muted" style="margin-bottom:0">Acumulado: ventas ${gs(anio.reduce((s, x) => s + x[1], 0))} · ganancia neta ${gs(anio.reduce((s, x) => s + x[2], 0))}</p></div>
    </div>`;
  $('#mP').onclick = () => { S.mes = mesAnterior(ym); render(); };
  $('#mN').onclick = () => { S.mes = mesSiguiente(ym); render(); };
}

/* =====================================================================
   MÁS: bases de datos y ajustes
   ===================================================================== */
const CAMPOS = {
  productos: { titulo: 'Producto', clave: 'Código', campos: [
    ['Código', 'text'], ['Producto', 'text', 'Línea, ej. Sahumerio Tibetano'], ['Aroma / variante', 'text'], ['Categoría', 'lista:Categorías de productos'],
    ['Presentación', 'text'], ['Proveedor principal', 'prov'], ['Costo de referencia (Gs.)', 'num'], ['Precio de venta (Gs.)', 'num'],
    ['Stock inicial', 'num'], ['Stock mínimo', 'num'], ['Stock ideal', 'num'], ['Código de barras', 'text', 'Separados por coma']] },
  gastos: { titulo: 'Gasto', clave: 'Monto (Gs.)', campos: [['Fecha', 'date'], ['Categoría', 'lista:Categorías de gasto'], ['Descripción', 'text'], ['Monto (Gs.)', 'num'],
    ['Fijo / Variable', 'lista:Tipo de gasto'], ['Medio de pago', 'lista:Medios de pago'], ['Pagado a', 'text'], ['Nº comprobante', 'text'], ['Observaciones', 'text']] },
  compras: { titulo: 'Compra', clave: 'Código producto', campos: [['Fecha', 'date'], ['Nº factura / remito', 'text'], ['Proveedor', 'prov'], ['Código producto', 'prod'], ['Cantidad', 'num'],
    ['Costo unitario (Gs.)', 'num'], ['Medio de pago', 'lista:Medios de pago'], ['Estado de pago', 'lista:Estado de pago (compras)'], ['Vence el pago', 'date'], ['Observaciones', 'text']] },
  bajas: { titulo: 'Baja', clave: 'Código producto', campos: [['Fecha', 'date'], ['Código producto', 'prod'], ['Tipo de baja / ajuste', 'lista:Tipos de baja / ajuste'], ['Cantidad (siempre positiva)', 'num'], ['Motivo / responsable', 'text']] },
  clientes: { titulo: 'Cliente', clave: 'Nombre y apellido', campos: [['Nombre y apellido', 'text'], ['Teléfono / WhatsApp', 'tel'], ['Email', 'email'], ['Ciudad / Barrio', 'text'],
    ['Dirección (para envíos)', 'text'], ['¿Cómo nos conoció? (canal)', 'lista:Canales de venta'], ['Fecha de alta', 'date'], ['Cumpleaños', 'date'], ['Aromas preferidos / notas', 'text']] },
  proveedores: { titulo: 'Proveedor', clave: 'Nombre / Razón social', campos: [['Nombre / Razón social', 'text'], ['RUC', 'text'], ['Persona de contacto', 'text'], ['Teléfono / WhatsApp', 'tel'],
    ['Email', 'email'], ['Ciudad', 'text'], ['Qué productos provee', 'text'], ['Condición de pago', 'text'], ['Plazo de entrega (días)', 'num'], ['Notas', 'text']] },
  vendedores: { titulo: 'Vendedor', clave: 'Nombre', campos: [['Nombre', 'text'], ['Teléfono', 'tel'], ['Email', 'email'], ['% Comisión', 'pct'], ['Fecha de ingreso', 'date'], ['Activo', 'lista:Sí / No'], ['Meta mensual (Gs.)', 'num']] },
  ferias: { titulo: 'Feria', clave: 'Nombre', campos: [['Nombre', 'text', 'Ej. Calle Palma 14/11'], ['Fecha', 'date'], ['Lugar', 'text'], ['Costo stand (Gs.)', 'num'], ['Notas', 'text']] },
};
function editar(hojaK, item, activarAlGuardar) {
  const D = datos(), def = CAMPOS[hojaK]; const raw = item ? (item.raw || item) : {};
  const fila = item ? item._r : null;
  const nuevo = !item;
  let sugerido = '';
  if (hojaK === 'productos' && nuevo) sugerido = '';
  const valor = (k, tipo) => { let v = raw[k]; if (v == null) v = ''; if (tipo === 'pct' && v !== '') v = Math.round(num(v) * 1000) / 10; if (nuevo && tipo === 'date' && /^Fecha/.test(k)) v = hoy(); return v; };
  hoja({ titulo: (nuevo ? 'Nuevo ' : 'Editar ') + def.titulo.toLowerCase(), cuerpo: () => def.campos.map(([k, tipo, ph]) => {
      const v = valor(k, tipo); const id = 'f_' + k.replace(/\W/g, '');
      let input;
      if (tipo.startsWith('lista:')) { const op = D.listas[tipo.slice(6)] || ['Sí', 'No']; input = `<select id="${id}" data-k="${esc(k)}"><option value=""></option>${op.map(o => `<option ${o === String(v) ? 'selected' : ''}>${esc(o)}</option>`).join('')}${v && !op.includes(String(v)) ? `<option selected>${esc(v)}</option>` : ''}</select>`; }
      else if (tipo === 'prov') input = `<select id="${id}" data-k="${esc(k)}"><option value=""></option>${D.proveedores.map(p => `<option ${p.nombre === String(v) ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}</select>`;
      else if (tipo === 'prod') input = `<select id="${id}" data-k="${esc(k)}"><option value=""></option>${D.productos.map(p => `<option value="${esc(p.codigo)}" ${p.codigo === String(v) ? 'selected' : ''}>${esc(p.codigo + ' · ' + p.linea + ' ' + p.aroma)}</option>`).join('')}</select>`;
      else input = `<input id="${id}" data-k="${esc(k)}" data-t="${tipo}" type="${tipo === 'date' ? 'date' : tipo === 'email' ? 'email' : tipo === 'tel' ? 'tel' : 'text'}" ${['num', 'pct'].includes(tipo) ? 'inputmode="decimal"' : ''} value="${esc(v)}" placeholder="${esc(ph || (tipo === 'pct' ? 'Ej. 10' : ''))}">`;
      return `<div class="field"><label for="${id}">${esc(k.replace(' (Gs.)', ' (Gs.)'))}${tipo === 'pct' ? ' (%)' : ''}</label>${input}</div>`; }).join('')
      + (hojaK === 'ferias' && nuevo ? `<label class="row small" style="gap:10px;margin:4px 0 0"><input type="checkbox" id="fGasto" checked style="width:22px;height:22px"> Registrar también el costo del stand como gasto</label>` : ''),
    pie: `${!nuevo && fila ? `<button class="btn danger" id="eDel" aria-label="Borrar">${IC.trash}</button>` : ''}<button class="btn soft" data-cerrar>Cancelar</button><button class="btn primary" style="flex:1" id="eOk">Guardar</button>`,
    alAbrir(h) {
      if (hojaK === 'productos' && nuevo) {
        const cod = $('#f_Código', h), cat = $('#f_Categoría', h);
        cat.onchange = () => { if (cod.value) return; const pref = { 'Sahumerios': 'SAH', 'Difusores': 'DIF', 'Porta sahumerios y accesorios': 'POR' }[cat.value] || cat.value.slice(0, 3).toUpperCase();
          const n = Math.max(0, ...D.productos.filter(p => p.codigo.startsWith(pref + '-')).map(p => parseInt(p.codigo.split('-')[1], 10) || 0)) + 1;
          cod.value = pref + '-' + (pref === 'POR' ? String(n).padStart(2, '0') : n); };
      }
      $('#eOk', h).onclick = () => {
        const datosF = {};
        h.querySelectorAll('[data-k]').forEach(el => { const k = el.dataset.k, t = el.dataset.t; let v = el.value.trim();
          if (t === 'num') v = v === '' ? '' : num(v.replace(/\./g, '').replace(',', '.'));
          if (t === 'pct') v = v === '' ? '' : num(v) / 100;
          if (!nuevo && String(raw[k] ?? '') === String(v)) return;
          if (nuevo && v === '') return;
          datosF[k] = v; });
        if (nuevo && !trim(datosF[def.clave])) return toast('Completá ' + def.clave + '.');
        if (hojaK === 'productos' && nuevo && D.prod[trim(datosF['Código'])]) return toast('Ya existe un producto con ese código.');
        if (Object.keys(datosF).length) encolar({ tipo: 'guardar', hoja: hojaK, fila: fila || null, datos: datosF });
        if (hojaK === 'ferias' && nuevo && $('#fGasto', h) && $('#fGasto', h).checked && num(datosF['Costo stand (Gs.)']) > 0)
          encolar({ tipo: 'guardar', hoja: 'gastos', datos: { 'Fecha': datosF['Fecha'] || hoy(), 'Categoría': 'Ferias (stands)', 'Descripción': datosF['Nombre'], 'Monto (Gs.)': num(datosF['Costo stand (Gs.)']), 'Fijo / Variable': 'Fijo', 'Medio de pago': 'Efectivo' } });
        if (hojaK === 'ferias' && (activarAlGuardar || (datosF['Fecha'] || '') === hoy())) { S.disp.feria = datosF['Nombre'] || raw['Nombre']; S.disp.feriaFecha = hoy(); store.set('disp', S.disp); }
        cerrarHoja(); toast('Guardado'); render(); };
      const del = $('#eDel', h); if (del) del.onclick = () => confirmar('¿Borrar este registro?', 'Se borra de la planilla. No se puede deshacer.', 'Borrar', () => {
        encolar({ tipo: 'borrar', hoja: hojaK, fila, claveValor: raw[def.clave] }); cerrarHoja(); toast('Borrado'); render(); });
    } });
}
function vMas() {
  const D = datos(); const sub = S.sub && CAMPOS[S.sub] && ['clientes', 'proveedores', 'vendedores', 'ferias', 'productos'].includes(S.sub) ? S.sub : null;
  if (sub) return vBase(sub);
  topbar('Más', 'Bases de datos y ajustes');
  const n = { clientes: D.clientes.length, proveedores: D.proveedores.length, vendedores: D.vendedores.length, ferias: D.ferias.length };
  $('#main').innerHTML = `
    <h2>Bases de datos</h2>
    <div class="list">${[['clientes', 'Clientes'], ['proveedores', 'Proveedores'], ['vendedores', 'Vendedores'], ['ferias', 'Ferias y eventos']].map(([k, t]) =>
      `<button class="li" data-b="${k}"><div class="nm"><b>${t}</b><span>${n[k]} registrados</span></div>${IC.chev}</button>`).join('')}</div>
    <h2>Este dispositivo</h2>
    <div class="list">
      <button class="li" id="mVend"><div class="nm"><b>Vendedor</b><span>${esc(S.disp.vendedor || 'Sin elegir')}</span></div>${IC.chev}</button>
      <div class="li"><div class="nm"><b>Canal cuando no hay feria</b><span>Para ventas fuera de ferias</span></div><select id="mCanal" style="max-width:48%;min-height:42px;border-radius:10px;border:1px solid var(--line-2);background:#fff;padding:0 8px">${D.listas['Canales de venta'].map(c => `<option ${c === S.disp.canal ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
      <div class="li"><div class="nm"><b>Medio de pago por defecto</b></div><select id="mMedio" style="max-width:48%;min-height:42px;border-radius:10px;border:1px solid var(--line-2);background:#fff;padding:0 8px">${D.listas['Medios de pago'].map(c => `<option ${c === S.disp.medio ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
    </div>
    <h2>Conexión con la planilla</h2>
    <div class="card">
      <p style="margin-top:0">${enGoogle() ? 'Conectada directamente a tu Google Sheet.' : apiUrl() ? 'Conectada a tu Google Sheet por internet.' : 'Esta copia no está conectada: los datos que ves son una foto de la planilla y lo que cargues queda guardado en este dispositivo.'}</p>
      <p class="small muted">Última sincronización: ${S.sync.ultima ? new Date(S.sync.ultima).toLocaleString('es-PY') : 'nunca'} · Pendientes de subir: ${S.cola.length}${S.sync.error && S.sync.estado === 'off' ? '<br>Último error: ' + esc(S.sync.error) : ''}</p>
      ${enGoogle() ? '' : `<div class="field"><label for="mUrl">Dirección de la app web (termina en /exec)</label><input id="mUrl" type="url" value="${esc(apiUrl())}" placeholder="https://script.google.com/macros/s/…/exec"></div>
      <div class="field"><label for="mClave">Clave de conexión</label><input id="mClave" type="password" autocomplete="off" value="${esc(clave())}"></div>`}
      ${linkConexion() ? `<button class="btn soft block" id="mShare" style="margin-bottom:10px">${IC.wa} Compartir link de conexión</button><p class="tiny muted" style="margin-top:-4px">Mandalo solo a tu equipo: quien lo tenga puede ver y cargar datos.</p>` : ''}
      <div class="row wrap"><button class="btn primary" id="mSync">${IC.refresh} Sincronizar ahora</button>${S.errores.length ? `<button class="btn soft" id="mErr">Ver ${S.errores.length} error(es)</button>` : ''}</div>
    </div>
    <img src="${LOGO_SRC}" alt="Aroma Studyo" style="width:140px;height:auto;display:block;margin:26px auto 0;border-radius:16px;opacity:.95">
    <p class="tiny muted" style="margin:10px 4px 18px;text-align:center">Tus datos viven en tu Google Sheet “Sistema Aromas - Gestión”.</p>`;
  $('#main').querySelectorAll('[data-b]').forEach(b => b.onclick = () => ir('mas', b.dataset.b));
  $('#mVend').onclick = () => elegirVendedor();
  $('#mCanal').onchange = e => { S.disp.canal = e.target.value; store.set('disp', S.disp); };
  $('#mMedio').onchange = e => { S.disp.medio = e.target.value; store.set('disp', S.disp); };
  const u = $('#mUrl'); if (u) u.onchange = () => { S.disp.apiUrl = trim(u.value); store.set('disp', S.disp); sincronizar(true); };
  const kc = $('#mClave'); if (kc) kc.onchange = () => { S.disp.clave = trim(kc.value); store.set('disp', S.disp); sincronizar(true); };
  const sh = $('#mShare'); if (sh) sh.onclick = () => { const l = linkConexion(), txt = 'Link para conectar la app de Aroma Studyo (abrilo en tu celular): ' + l;
    if (navigator.share) navigator.share({ title: 'Aroma Studyo', text: txt }).catch(() => {}); else if (navigator.clipboard) navigator.clipboard.writeText(l).then(() => toast('Link copiado')); };
  $('#mSync').onclick = () => { const u2 = $('#mUrl'); if (u2) { S.disp.apiUrl = trim(u2.value); } const k2 = $('#mClave'); if (k2) { S.disp.clave = trim(k2.value); } store.set('disp', S.disp); sincronizar(true).then(() => { toast(S.sync.estado === 'ok' ? 'Todo al día' : 'No se pudo conectar'); render(); }); };
  const me = $('#mErr'); if (me) me.onclick = verErrores;
}
function vBase(k) {
  const D = datos(), def = CAMPOS[k];
  const titulos = { clientes: 'Clientes', proveedores: 'Proveedores', vendedores: 'Vendedores', ferias: 'Ferias y eventos' };
  topbar(titulos[k], '', `<button class="btn ghost" id="bVolver" style="padding:0;min-height:36px">${IC.back} Más</button>`);
  $('#bVolver').onclick = () => { S.sub = null; render(); };
  const items = D[k];
  const info = x => {
    if (k === 'clientes') { const vs = D.ventas.filter(v => v.cliente === x.nombre); const t = vs.reduce((s, v) => s + v.total, 0); const u = vs.map(v => v.fecha).sort().pop();
      return [x.nombre, [x.tel, u ? 'última compra ' + fechaCorta(u) : 'sin compras'].filter(Boolean).join(' · '), t ? fmt(t) : '']; }
    if (k === 'proveedores') { const t = D.compras.filter(c => c.proveedor === x.nombre).reduce((s, c) => s + c.total, 0); const deuda = D.compras.filter(c => c.proveedor === x.nombre && c.estado === 'Pendiente').reduce((s, c) => s + c.total, 0);
      return [x.nombre, [x.contacto, x.tel, deuda ? 'debés ' + fmt(deuda) : ''].filter(Boolean).join(' · '), t ? fmt(t) : '']; }
    if (k === 'vendedores') { const m = hoy().slice(0, 7); const t = D.ventas.filter(v => v.vendedor === x.nombre && v.fecha.startsWith(m)).reduce((s, v) => s + v.total, 0);
      return [x.nombre, (x.comision ? 'comisión ' + pct(x.comision) : 'sin comisión') + (x.activo ? '' : ' · inactivo'), fmt(t) + '<span class="tiny muted" style="display:block;font-weight:500">este mes</span>']; }
    if (k === 'ferias') { const vs = D.ventas.filter(v => v.feria === x.nombre); const t = vs.reduce((s, v) => s + v.total, 0); const g = vs.reduce((s, v) => s + v.ganancia, 0);
      return [x.nombre, [fechaCorta(x.fecha), x.lugar, x.costo ? 'stand ' + fmt(x.costo) : ''].filter(Boolean).join(' · '), t ? fmt(t) + `<span class="tiny ${g - x.costo >= 0 ? 'up' : 'down'}" style="display:block">${g - x.costo >= 0 ? 'dejó ' : 'perdió '}${fmt(Math.abs(g - x.costo))}</span>` : ''];
    }
  };
  $('#main').innerHTML = `<div class="toolbar"><label class="search">${IC.buscar}<input id="bq" type="search" placeholder="Buscar" autocomplete="off"></label></div><div class="list" id="bl"></div>`;
  const pintar = q => { const nq = norm(q || '');
    $('#bl').innerHTML = items.filter(x => norm(x.nombre).includes(nq)).map((x, i) => { const [a, b2, c] = info(x); return `<button class="li" data-i="${items.indexOf(x)}"><div class="nm"><b>${esc(a)}</b><span>${esc(b2)}</span></div><div class="rt"><b>${c}</b></div></button>`; }).join('') || `<div class="empty">No hay ${titulos[k].toLowerCase()} todavía.</div>`; };
  pintar(); $('#bq').oninput = e => pintar(e.target.value);
  $('#bl').onclick = e => { const b = e.target.closest('[data-i]'); if (b) editar(k, items[+b.dataset.i]); };
  fab(() => editar(k, null));
}
function verErrores() {
  hoja({ titulo: 'Operaciones con error', cuerpo: () => S.errores.map((e, i) => `<div class="card" style="margin-bottom:10px"><b>${esc(e.op ? (e.op.tipo === 'venta' ? 'Venta de ' + (e.op.lineas || []).length + ' producto(s)' : e.op.tipo + ' en ' + (e.op.hoja || '')) : 'Operación')}</b>
      <p class="small" style="margin:6px 0">${esc(e.error)}</p><div class="row"><button class="btn soft" data-reint="${i}">Reintentar</button><button class="btn ghost" data-desc="${i}">Descartar</button></div></div>`).join('') || '<div class="empty">Sin errores.</div>',
    alAbrir(h) { $('.bd', h).onclick = e => { const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.reint != null) { const er = S.errores.splice(+b.dataset.reint, 1)[0]; store.set('errores', S.errores); if (er.op) { er.op.id = uid(); encolar(er.op); } }
      if (b.dataset.desc != null) { S.errores.splice(+b.dataset.desc, 1); store.set('errores', S.errores); }
      cerrarHoja(); render(); }; } });
}

/* =====================================================================
   HOJAS, CONFIRMACIONES Y AVISOS
   ===================================================================== */
const pilaHojas = [];
function hoja(cfg) {
  const tt = $('#toast'); if (tt) tt.style.display = 'none';
  const z = cfg.z || 50 + pilaHojas.length * 2;
  const scrim = document.createElement('div'); scrim.className = 'scrim'; scrim.style.zIndex = z;
  const h = document.createElement('section'); h.className = 'sheet'; h.style.zIndex = z + 1; h.setAttribute('role', 'dialog'); h.setAttribute('aria-modal', 'true');
  h.innerHTML = `<div class="grab"></div><div class="hd"><h3>${esc(cfg.titulo)}</h3><button class="iconbtn" data-cerrar aria-label="Cerrar" style="width:42px;height:42px">${IC.x}</button></div>
    <div class="bd">${cfg.cuerpo.call(cfg)}</div>${cfg.pie ? `<div class="ft">${cfg.pie}</div>` : ''}`;
  $('#layer').append(scrim, h);
  const entry = { scrim, h, cfg }; pilaHojas.push(entry);
  requestAnimationFrame(() => { scrim.classList.add('show'); h.classList.add('show'); });
  scrim.onclick = () => cerrarHoja();
  h.addEventListener('click', e => { if (e.target.closest('[data-cerrar]')) cerrarHoja(); });
  if (cfg.alAbrir) cfg.alAbrir.call(cfg, h);
  const foco = h.querySelector('input:not([type=checkbox]),select'); if (foco && window.innerWidth >= 900) foco.focus();
  return h;
}
function cerrarHoja(silencioso) {
  const e = pilaHojas.pop(); if (!e) return;
  e.scrim.classList.remove('show'); e.h.classList.remove('show');
  setTimeout(() => { e.scrim.remove(); e.h.remove(); }, 230);
  if (!silencioso && e.cfg.alCerrar) e.cfg.alCerrar();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && pilaHojas.length) cerrarHoja(); });
function confirmar(titulo, texto, accion, fn) {
  hoja({ titulo, cuerpo: () => `<p style="margin-top:0">${esc(texto)}</p>`, pie: `<button class="btn soft" data-cerrar style="flex:1">Cancelar</button><button class="btn danger" style="flex:1" id="cfOk">${esc(accion)}</button>`,
    alAbrir(h) { $('#cfOk', h).onclick = () => { cerrarHoja(true); setTimeout(fn, 10); }; } });
}
let toastT;
function toast(msg, accion, fn) {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg;
  if (accion) { const b = document.createElement('button'); b.textContent = accion; b.onclick = () => { t.style.display = 'none'; fn(); }; t.appendChild(b); }
  t.style.display = 'flex'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', accion ? 6000 : 3200);
}
function cancelarVenta() {
  if (!S.carrito.length) return;
  const copia = S.carrito.map(l => Object.assign({}, l)), medio = S.medio;
  S.carrito = []; S.medio = null; vibrar(25);
  pintarTiles(); pintarCarrito();
  toast('Venta cancelada', 'Deshacer', () => { S.carrito = copia; S.medio = medio; pintarTiles(); pintarCarrito(); });
}

/* =====================================================================
   INICIO
   ===================================================================== */
recalcular();
render();
if (store.get('recienConectado', false)) { store.set('recienConectado', false); setTimeout(() => toast('Celular conectado a la planilla'), 600); }
if ('serviceWorker' in navigator && location.protocol === 'https:' && !enGoogle()) navigator.serviceWorker.register('sw.js').catch(() => {});
if (!S.disp.vendedor && datos().vendedores.length) setTimeout(() => elegirVendedor(), 400);
sincronizar(true);
</script>
